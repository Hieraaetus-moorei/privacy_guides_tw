name: Mirror repo from freeland to leecher

on:
  schedule:
    - cron: '0 0 * * *' # 每小時執行八次
  workflow_dispatch:     # 腳動觸發

jobs:
  mirror:
    runs-on: ubuntu-latest # 用 Arch Linux
    steps:
    - name: Mirror repository
      run: |
        git clone --mirror https://codeberg.org/Codeglacier/privacy_guides_tw.git
        cd privacy_guides_tw.git
        git remote set-url --push origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Hieraaetus-moorei/privacy_guides_tw.git
        git push --mirror
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
